<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커플의 판결 | 누구 말이 맞을까?</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
</head>
<body>
    <div id="app">
        <!-- App Header will be injected here -->
        <app-header></app-header>
        
        <main class="container">
            <!-- Views will be toggled here -->
            <section id="create-view" class="view">
                <question-form></question-form>
            </section>
            
            <section id="vote-view" class="view hidden">
                <vote-list></vote-list>
            </section>
        </main>
    </div>

    <!-- Templates -->
    <template id="app-header-template">
        <style>
            header {
                padding: 2rem 1rem;
                text-align: center;
                background: var(--surface-color);
                box-shadow: var(--shadow-soft);
                margin-bottom: 2rem;
            }
            .logo {
                font-size: 2rem;
                font-weight: 800;
                background: linear-gradient(135deg, var(--primary), var(--secondary));
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                margin-bottom: 1.5rem;
            }
            nav {
                display: flex;
                justify-content: center;
                gap: 1rem;
            }
            .nav-btn {
                background: transparent;
                color: var(--text-muted);
                border: 2px solid transparent;
                padding: 0.5rem 1.2rem;
                border-radius: var(--border-radius-sm);
                font-weight: 600;
            }
            .nav-btn.active {
                color: var(--primary);
                border-color: var(--primary);
                background: oklch(0.6 0.18 var(--primary-hue) / 0.05);
            }
        </style>
        <header>
            <div class="logo">커플의 판결</div>
            <nav>
                <button class="nav-btn active" data-view="create-view">질문 생성하기</button>
                <button class="nav-btn" data-view="vote-view">투표하기</button>
            </nav>
        </header>
    </template>

    <template id="question-form-template">
        <div class="card">
            <h2 class="mb-4">새로운 논쟁 제출</h2>
            <form id="submit-form">
                <div class="input-group">
                    <label for="situation-a">상황 A (내 입장)</label>
                    <textarea id="situation-a" rows="4" placeholder="당신의 입장을 설명해주세요..." required></textarea>
                </div>
                <div class="input-group">
                    <label for="situation-b">상황 B (상대방 입장)</label>
                    <textarea id="situation-b" rows="4" placeholder="상대방의 입장을 설명해주세요..." required></textarea>
                </div>
                <div class="input-group">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox" id="show-gender" style="width: auto;">
                        성별 정보를 공개하시겠습니까?
                    </label>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">판결 요청하기</button>
            </form>
        </div>
    </template>

    <template id="vote-card-template">
        <style>
            .vote-card {
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
                margin-bottom: 2rem;
            }
            .situation {
                padding: 1.5rem;
                border-radius: var(--border-radius-sm);
                background: var(--bg-color);
                border-left: 4px solid var(--primary);
            }
            .situation.b {
                border-left-color: var(--secondary);
            }
            .situation-label {
                font-weight: 800;
                font-size: 0.8rem;
                text-transform: uppercase;
                margin-bottom: 0.5rem;
                display: block;
            }
            .vote-actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }
            .results-container {
                margin-top: 1rem;
                animation: fadeIn 0.5s ease-out;
            }
            .bar-wrapper {
                height: 40px;
                background: oklch(0.9 0 0);
                border-radius: var(--border-radius-sm);
                overflow: hidden;
                display: flex;
                position: relative;
            }
            .bar {
                height: 100%;
                transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
                display: flex;
                align-items: center;
                padding: 0 1rem;
                color: white;
                font-weight: 700;
                font-size: 0.9rem;
            }
            .bar-a { background: var(--primary); }
            .bar-b { background: var(--secondary); justify-content: flex-end; }
            
            .gender-info {
                font-size: 0.8rem;
                color: var(--text-muted);
                text-align: right;
            }

            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
        </style>
        <div class="card vote-card">
            <div class="gender-info"></div>
            <div class="situation a">
                <span class="situation-label">입장 A</span>
                <p class="text-a"></p>
            </div>
            <div class="situation b">
                <span class="situation-label">입장 B</span>
                <p class="text-b"></p>
            </div>
            <div class="vote-actions">
                <button class="btn btn-primary btn-vote-a">A가 맞다</button>
                <button class="btn btn-secondary btn-vote-b">B가 맞다</button>
            </div>
            <div class="results-container hidden">
                <div class="bar-wrapper">
                    <div class="bar bar-a" style="width: 0%">0%</div>
                    <div class="bar bar-b" style="width: 0%">0%</div>
                </div>
                <p class="text-center mt-4 total-votes-text"></p>
            </div>
        </div>
    </template>

    <script src="main.js" type="module"></script>
</body>
</html>
