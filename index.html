<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커플의 판결 | 누구 말이 맞을까?</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
</head>
<body>
    <div id="app">
        <app-header></app-header>
        
        <main class="container">
            <section id="create-view" class="view">
                <question-form></question-form>
            </section>
            
            <section id="vote-view" class="view hidden">
                <vote-list></vote-list>
            </section>
        </main>
    </div>

    <!-- Templates -->
    <template id="app-header-template">
        <style>
            header {
                padding: 2rem 1rem;
                text-align: center;
                background: var(--surface-color);
                box-shadow: var(--shadow-soft);
                margin-bottom: 2rem;
            }
            .logo {
                font-size: 2rem;
                font-weight: 800;
                background: linear-gradient(135deg, var(--primary), var(--secondary));
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                margin-bottom: 1.5rem;
            }
            nav {
                display: flex;
                justify-content: center;
                gap: 1rem;
            }
            .nav-btn {
                background: transparent;
                color: var(--text-muted);
                border: 2px solid transparent;
                padding: 0.5rem 1.2rem;
                border-radius: var(--border-radius-sm);
                font-weight: 600;
            }
            .nav-btn.active {
                color: var(--primary);
                border-color: var(--primary);
                background: oklch(0.6 0.18 var(--primary-hue) / 0.05);
            }
        </style>
        <header>
            <div class="logo">커플의 판결</div>
            <nav>
                <button class="nav-btn active" data-view="create-view">질문 생성하기</button>
                <button class="nav-btn" data-view="vote-view">투표하기</button>
            </nav>
        </header>
    </template>

    <template id="question-form-template">
        <style>
            .gender-selection {
                display: flex;
                gap: 0.5rem;
                margin-top: 0.5rem;
            }
            .gender-btn {
                padding: 0.3rem 0.8rem;
                font-size: 0.8rem;
                border-radius: 20px;
                border: 1px solid oklch(0.9 0.02 var(--primary-hue));
                background: var(--surface-color);
                color: var(--text-muted);
            }
            .gender-btn.active {
                background: var(--primary);
                color: white;
                border-color: var(--primary);
            }
            .gender-btn.secondary.active {
                background: var(--secondary);
                border-color: var(--secondary);
            }
            .hidden-feature {
                display: none;
            }
        </style>
        <div class="card">
            <h2 class="mb-4">새로운 논쟁 제출</h2>
            <form id="submit-form">
                <div class="input-group">
                    <label for="situation-context">전체 상황 설명</label>
                    <textarea id="situation-context" rows="3" placeholder="어떤 상황에서 싸움이 일어났는지 전체적인 맥락을 적어주세요..." required></textarea>
                </div>
                
                <div class="input-group">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; margin-bottom: 1rem;">
                        <input type="checkbox" id="show-gender" style="width: auto;">
                        성별 정보를 공개하시겠습니까?
                    </label>
                </div>

                <div class="input-group">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label for="situation-a">A 입장</label>
                        <div id="gender-a-wrapper" class="gender-selection hidden-feature">
                            <button type="button" class="gender-btn" data-gender="남">남</button>
                            <button type="button" class="gender-btn" data-gender="여">여</button>
                        </div>
                    </div>
                    <textarea id="situation-a" rows="4" placeholder="A의 입장을 설명해주세요..." required></textarea>
                </div>

                <div class="input-group">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label for="situation-b">B 입장</label>
                        <div id="gender-b-wrapper" class="gender-selection hidden-feature">
                            <button type="button" class="gender-btn secondary" data-gender="남">남</button>
                            <button type="button" class="gender-btn secondary" data-gender="여">여</button>
                        </div>
                    </div>
                    <textarea id="situation-b" rows="4" placeholder="B의 입장을 설명해주세요..." required></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">판결 요청하기</button>
            </form>
        </div>
    </template>

    <template id="vote-card-template">
        <style>
            .vote-card {
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
                margin-bottom: 2rem;
                position: relative;
            }
            .context-box {
                padding: 1rem;
                background: oklch(0.95 0.01 var(--primary-hue));
                border-radius: var(--border-radius-sm);
                font-size: 0.95rem;
                border: 1px dashed oklch(0.8 0.05 var(--primary-hue));
                color: var(--text-color);
            }
            .situation {
                padding: 1.5rem;
                border-radius: var(--border-radius-sm);
                background: var(--bg-color);
                border-left: 4px solid var(--primary);
                position: relative;
            }
            .situation.b {
                border-left-color: var(--secondary);
            }
            .situation-label {
                font-weight: 800;
                font-size: 0.8rem;
                text-transform: uppercase;
                margin-bottom: 0.5rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .gender-tag {
                font-size: 0.7rem;
                padding: 0.1rem 0.5rem;
                background: oklch(0.6 0.18 var(--primary-hue) / 0.1);
                color: var(--primary);
                border-radius: 10px;
            }
            .situation.b .gender-tag {
                background: oklch(0.65 0.22 var(--secondary-hue) / 0.1);
                color: var(--secondary);
            }
            .vote-actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }
            .results-container {
                margin-top: 1rem;
                animation: fadeIn 0.5s ease-out;
            }
            .bar-wrapper {
                height: 40px;
                background: oklch(0.9 0 0);
                border-radius: var(--border-radius-sm);
                overflow: hidden;
                display: flex;
                position: relative;
            }
            .bar {
                height: 100%;
                transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
                display: flex;
                align-items: center;
                padding: 0 1rem;
                color: white;
                font-weight: 700;
                font-size: 0.9rem;
            }
            .bar-a { background: var(--primary); }
            .bar-b { background: var(--secondary); justify-content: flex-end; }
            
            .card-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 0.8rem;
            }
            .delete-btn {
                background: transparent;
                color: var(--danger);
                font-weight: 600;
                padding: 0.2rem 0.5rem;
                opacity: 0.6;
            }
            .delete-btn:hover {
                opacity: 1;
                background: oklch(0.6 0.2 20 / 0.1);
                border-radius: 4px;
            }

            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
        </style>
        <div class="card vote-card">
            <div class="card-header">
                <span class="gender-info"></span>
                <button class="delete-btn">삭제</button>
            </div>
            <div class="context-box">
                <span class="situation-label">사건 개요</span>
                <p class="text-context"></p>
            </div>
            <div class="situation a">
                <span class="situation-label">
                    입장 A
                    <span class="gender-tag tag-a hidden"></span>
                </span>
                <p class="text-a"></p>
            </div>
            <div class="situation b">
                <span class="situation-label">
                    입장 B
                    <span class="gender-tag tag-b hidden"></span>
                </span>
                <p class="text-b"></p>
            </div>
            <div class="vote-actions">
                <button class="btn btn-primary btn-vote-a">A가 맞다</button>
                <button class="btn btn-secondary btn-vote-b">B가 맞다</button>
            </div>
            <div class="results-container hidden">
                <div class="bar-wrapper">
                    <div class="bar bar-a" style="width: 0%">0%</div>
                    <div class="bar bar-b" style="width: 0%">0%</div>
                </div>
                <p class="text-center mt-4 total-votes-text"></p>
            </div>
        </div>
    </template>

    <script src="main.js" type="module"></script>
</body>
</html>
